name: Deploy CareMate GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - ".nojekyll"
      - "data/patient.json"
      - "data/history.json"
      - "data/health_result.json"
      - "data/chat_result.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-static-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare Pages artifact
        run: |
          rm -rf site
          mkdir -p site/data
          cp index.html site/index.html
          touch site/.nojekyll
          cp data/patient.json site/data/patient.json
          cp data/history.json site/data/history.json
          cp data/health_result.json site/data/health_result.json
          cp data/chat_result.json site/data/chat_result.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --use-system-ca
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy CareMate site
        id: deployment
        uses: actions/deploy-pages@v4
